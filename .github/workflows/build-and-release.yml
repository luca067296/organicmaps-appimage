name: Build and Release Organic Maps AppImage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04 # Changed from 24.04 to maximize backward compatibility

    steps:
      - name: Add PPAs for older Ubuntu support
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          # Add workarounds for Ubuntu 22.04 as per Organic Maps documentation
          sudo add-apt-repository -y ppa:savoury1/qt-6-2
          sudo add-apt-repository -y ppa:reviczky/freetype
          sudo apt-get update

      - name: Install system dependencies
        run: |
          sudo apt-get install -y build-essential cmake ninja-build python3 qt6-base-dev qt6-positioning-dev libc++-dev libfreetype-dev libglvnd-dev libgl1-mesa-dev libharfbuzz-dev libicu-dev libqt6svg6-dev libsqlite3-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev zlib1g-dev

      - name: Clone Organic Maps repository
        run: git clone --recurse-submodules --shallow-submodules --depth=1 https://github.com/organicmaps/organicmaps.git

      - name: Configure and build
        run: |
          cd organicmaps
          bash ./configure.sh
          cmake --preset release
          cmake --build --preset release --target desktop

      - name: Package AppImage with Qt dependencies
        run: |
          cd organicmaps
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/organicmaps
          
          cp build/release/OMaps AppDir/usr/bin/
          cp -r data/* AppDir/usr/share/organicmaps/
          
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/OMaps" -data_path "$HERE/usr/share/organicmaps" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          cat << 'EOF' > AppDir/organicmaps.desktop
          [Desktop Entry]
          Type=Application
          Name=Organic Maps
          Exec=AppRun %F
          Icon=organicmaps
          Terminal=false
          Categories=Education;Science;Maps;Geography;
          EOF
          
          ICON_PATH=$(find data -iname "*logo*.png" -o -iname "*icon*.png" | head -n 1)
          if [ -n "$ICON_PATH" ]; then
              cp "$ICON_PATH" AppDir/organicmaps.png
          else
              touch AppDir/organicmaps.png
          fi
          
          # Download linuxdeploy and linuxdeploy-plugin-qt
          wget -qO linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -qO linuxdeploy-plugin-qt.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          export QMAKE=/usr/lib/qt6/bin/qmake
          export EXTRA_QT_PLUGINS="positioning,svg"

          # Bundle everything into the AppImage
          ./linuxdeploy.AppImage --appimage-extract-and-run --appdir AppDir --plugin qt --output appimage
          
          mv Organic_Maps-x86_64.AppImage OrganicMaps-x86_64.AppImage || mv *.AppImage OrganicMaps-x86_64.AppImage

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=$(date +'%Y.%m.%d')
          gh release create "$TAG_NAME" organicmaps/OrganicMaps-x86_64.AppImage \
            --repo ${{ github.repository }} \
            --title "Organic Maps Unofficial AppImage ($TAG_NAME)" \
            --notes "Unofficial Linux build generated via GitHub Actions from the official source code."
