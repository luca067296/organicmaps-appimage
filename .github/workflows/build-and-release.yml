name: Build and Release Organic Maps (Anylinux)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Add PPAs for older Ubuntu support
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:reviczky/freetype
          sudo apt-get update

      - name: Install system dependencies (excluding Qt)
        run: |
          sudo apt-get install -y build-essential cmake ninja-build python3 python3-pip libc++-dev libfreetype-dev libglvnd-dev libgl1-mesa-dev libharfbuzz-dev libicu-dev libsqlite3-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev zlib1g-dev git wget

      - name: Install Qt 6.5 via aqtinstall
        run: |
          pip3 install aqtinstall
          # Install Qt 6.5.3 and the specific modules required by Organic Maps
          python3 -m aqt install-qt linux desktop 6.5.3 gcc_64 -m qtpositioning qtsvg

      - name: Clone Organic Maps
        run: git clone --recurse-submodules --shallow-submodules --depth=1 https://github.com/organicmaps/organicmaps.git

      - name: Configure and build Organic Maps
        run: |
          cd organicmaps
          
          # Tell CMake where to find the Qt installation
          export CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/6.5.3/gcc_64
          
          bash ./configure.sh
          cmake --preset release
          cmake --build --preset release --target desktop

      - name: Clone Anylinux repository
        run: git clone https://github.com/pkgforge-dev/anylinux-appimages.git

      - name: Prepare application files
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/organicmaps
          
          cp organicmaps/build/release/OMaps AppDir/usr/bin/
          cp -r organicmaps/data/* AppDir/usr/share/organicmaps/
          
          ICON_PATH=$(find organicmaps/data -iname "*logo*.png" -o -iname "*icon*.png" | head -n 1)
          if [ -n "$ICON_PATH" ]; then
              cp "$ICON_PATH" AppDir/organicmaps.png
          else
              touch AppDir/organicmaps.png
          fi

          cat << 'EOF' > AppDir/organicmaps.desktop
          [Desktop Entry]
          Type=Application
          Name=Organic Maps
          Exec=OMaps -data_path /usr/share/organicmaps
          Icon=organicmaps
          Terminal=false
          Categories=Education;Science;Maps;Geography;
          EOF

      - name: Package with Anylinux
        run: |
          chmod +x anylinux-appimages/useful-tools/uruntime2appimage.sh
          chmod +x anylinux-appimages/useful-tools/quick-sharun.sh
          
          ./anylinux-appimages/useful-tools/uruntime2appimage.sh AppDir OrganicMaps-x86_64.AppImage

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=$(date +'%Y.%m.%d')
          gh release create "$TAG_NAME" OrganicMaps-x86_64.AppImage \
            --repo ${{ github.repository }} \
            --title "Organic Maps Anylinux AppImage ($TAG_NAME)" \
            --notes "Unofficial Linux build generated via GitHub Actions using the Anylinux packaging method."
