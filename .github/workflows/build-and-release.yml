name: Build and Release Organic Maps (Anylinux)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 qt6-base-dev qt6-positioning-dev libc++-dev libfreetype-dev libglvnd-dev libgl1-mesa-dev libharfbuzz-dev libicu-dev libqt6svg6-dev libsqlite3-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev zlib1g-dev libssl-dev git wget

      - name: Clone Organic Maps
        run: git clone --recurse-submodules --shallow-submodules --depth=1 https://github.com/organicmaps/organicmaps.git

      - name: Configure and build Organic Maps
        run: |
          cd organicmaps
          bash ./configure.sh
          cmake --preset release
          cmake --build --preset release --target desktop

      - name: Clone Anylinux repository
        run: git clone https://github.com/pkgforge-dev/anylinux-appimages.git

      - name: Prepare application files
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/organicmaps
          
          cp organicmaps/build/release/OMaps AppDir/usr/bin/OMaps.bin
          cp -r organicmaps/data/* AppDir/usr/share/organicmaps/
          
          # Create a wrapper script to separate read-only resources from writable user data
          cat << 'EOF' > AppDir/usr/bin/OMaps
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          
          USER_DATA="${XDG_DATA_HOME:-$HOME/.local/share}/OMaps"
          mkdir -p "$USER_DATA"
          
          exec "$HERE/OMaps.bin" -resources_path "$HERE/../share/organicmaps" -data_path "$USER_DATA" "$@"
          EOF
          chmod +x AppDir/usr/bin/OMaps

          # Copy logo.png from the repository root to AppDir
          cp logo.png AppDir/organicmaps.png

          cat << 'EOF' > AppDir/organicmaps.desktop
          [Desktop Entry]
          Type=Application
          Name=Organic Maps
          Exec=OMaps
          Icon=organicmaps
          Terminal=false
          Categories=Education;Science;Maps;Geography;
          EOF

      - name: Gather dependencies and Package with Anylinux
        run: |
          wget -qO linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -qO linuxdeploy-plugin-qt.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          export QMAKE=/usr/lib/qt6/bin/qmake
          export EXTRA_QT_PLUGINS="positioning,svg,wayland,tls,networkinformation"

          # Dynamically locate the system's OpenSSL libraries
          SSL_LIB=$(ldconfig -p | grep libssl.so | awk '{print $4}' | head -n 1)
          CRYPTO_LIB=$(ldconfig -p | grep libcrypto.so | awk '{print $4}' | head -n 1)

          # Force linuxdeploy to include the OpenSSL libraries using the -l flag
          ./linuxdeploy.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --plugin qt \
            --executable AppDir/usr/bin/OMaps.bin \
            -d AppDir/organicmaps.desktop \
            -i AppDir/organicmaps.png \
            -l "$SSL_LIB" \
            -l "$CRYPTO_LIB"

          chmod +x anylinux-appimages/useful-tools/quick-sharun.sh
          ./anylinux-appimages/useful-tools/quick-sharun.sh --make-appimage AppDir
          
          GENERATED_APPIMAGE=$(ls *.AppImage | grep -v linuxdeploy | head -n 1)
          mv "$GENERATED_APPIMAGE" OrganicMaps-x86_64.AppImage

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=$(date +'%Y.%m.%d')
          gh release create "$TAG_NAME" OrganicMaps-x86_64.AppImage \
            --repo ${{ github.repository }} \
            --title "Organic Maps Anylinux AppImage ($TAG_NAME)" \
            --notes "Unofficial Linux build generated via GitHub Actions using the Anylinux packaging method."
